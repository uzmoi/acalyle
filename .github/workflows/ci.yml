name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      turbo-hash: ${{ steps.turbo-hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - id: turbo-hash
        run: |
          hash=$(pnpm codegen --dry=json | sha256sum | cut -d ' ' -f 1)
          echo "hash=$hash" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/.turbo'
          key: ${{ runner.os }}-turbo-${{ steps.turbo-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-turbo-

      - run: pnpm codegen
  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/.turbo'
          key: ${{ runner.os }}-turbo-${{ needs.prepare.outputs.turbo-hash }}
          fail-on-cache-miss: true

      - run: pnpm coverage --output-logs=new-only

      - id: coverage_files
        run: |
          files=$(ls {apps,packages}/*/coverage/coverage-final.json | paste -sd ",")
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ${{ steps.coverage_files.outputs.files }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: apps/client/coverage/test-report.junit.xml
          report_type: test_results
  lint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/.turbo'
          key: ${{ runner.os }}-turbo-${{ needs.prepare.outputs.turbo-hash }}
          fail-on-cache-miss: true

      - run: pnpm lint --output-logs=new-only
  chromatic:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/.turbo'
          key: ${{ runner.os }}-turbo-${{ needs.prepare.outputs.turbo-hash }}
          fail-on-cache-miss: true

      - run: pnpm codegen --output-logs=new-only

      - name: Run Chromatic on @acalyle/client
      # cspell:ignore chromaui
        uses: chromaui/action@4c20b95e9d3209ecfdf9cd6aace6bbde71ba1694 # v13.3.4
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/client
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/setup@4700d737c3d7a2e7199f3d42a920f0bf7f34e411 # v2.0.1
        with:
          cache: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '**/.turbo'
          key: ${{ runner.os }}-turbo-${{ needs.prepare.outputs.turbo-hash }}
          fail-on-cache-miss: true

      - run: pnpm codegen --output-logs=new-only

      - run: pnpm build
        working-directory: apps/client
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
