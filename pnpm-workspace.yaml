packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: false
  lefthook: true
  unrs-resolver: false

minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - asarina
  # Renovate security update: vite@8.2.4
  - vite@8.2.4
  # Renovate security update: storybook@10.6.2
  - storybook@10.6.2

patchedDependencies:
  "@wyw-in-js/shared@2.3.0": patches/@wyw-in-js__shared@2.3.0.patch
  "@wyw-in-js/transform": patches/@wyw-in-js__transform.patch

publicHoistPattern:
  - "@typescript/*"
  - "@nitrogql/*"
